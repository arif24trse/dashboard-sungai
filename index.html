<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Telemetri Air Sungai</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 25px; }
        header h1 { font-size: 1.8rem; color: #38bdf8; }
        header p { color: #94a3b8; font-size: 0.9rem; margin-top: 5px; }

        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; margin-bottom: 25px; }
        .card { background: #1e293b; border-radius: 12px; padding: 20px; border: 1px solid #334155; text-align: center; }
        .card-title { font-size: 0.85rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
        .card-value { font-size: 2.5rem; font-weight: bold; }
        .unit { font-size: 1rem; color: #64748b; font-weight: normal; }

        .status-box { display: inline-block; padding: 8px 20px; border-radius: 20px; font-weight: bold; font-size: 1.2rem; }
        .st-normal { background: #065f46; color: #34d399; }
        .st-waspada { background: #854d0e; color: #facc15; }
        .st-bahaya { background: #991b1b; color: #f87171; }

        .visualizer { background: #1e293b; border-radius: 12px; padding: 20px; border: 1px solid #334155; margin-bottom: 25px; }
        .river-outer { width: 100%; height: 180px; background: #0f172a; border: 2px solid #475569; border-radius: 8px; position: relative; overflow: hidden; display: flex; align-items: flex-end; }
        .water-inner { width: 100%; height: 0%; background: linear-gradient(180deg, #38bdf8 0%, #0284c7 100%); transition: height 0.6s ease; }

        .log-section { background: #1e293b; border-radius: 12px; padding: 20px; border: 1px solid #334155; }
        .log-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9rem; }
        .log-table th, .log-table td { padding: 10px; text-align: left; border-bottom: 1px solid #334155; }
        .log-table th { color: #94a3b8; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Monitoring Ketinggian Sungai (ThingSpeak)</h1>
        <p>Status Sync: <span id="sync-status" style="color: #facc15;">Mengambil data...</span></p>
    </header>

    <div class="grid">
        <div class="card">
            <div class="card-title">Tinggi Air Sungai</div>
            <div class="card-value" id="val-tinggi">0.0 <span class="unit">cm</span></div>
        </div>
        <div class="card">
            <div class="card-title">Jarak Sensor ke Air</div>
            <div class="card-value" id="val-jarak">0.0 <span class="unit">cm</span></div>
        </div>
        <div class="card">
            <div class="card-title">Status Siaga</div>
            <div id="val-status" class="status-box st-normal">NORMAL</div>
        </div>
    </div>

    <div class="visualizer">
        <div class="card-title" style="margin-bottom: 15px;">Visual Ketinggian Air Sungai</div>
        <div class="river-outer">
            <div id="water-fill" class="water-inner"></div>
        </div>
    </div>

    <div class="log-section">
        <div class="card-title">Riwayat Telemetri Terakhir (ThingSpeak Feeds)</div>
        <table class="log-table">
            <thead>
                <tr>
                    <th>Waktu (WIB)</th>
                    <th>Tinggi Air (cm)</th>
                    <th>Jarak Sensor (cm)</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="log-body">
                <tr><td colspan="4" style="text-align:center; color:#64748b;">Memuat data...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    // --- KONFIGURASI THINGSPEAK (SUDAH DISESUAIKAN) ---
    const CHANNEL_ID = '3573801'; 
    const READ_API_KEY = '5DY3SHV24BDSUZWJ';
    const TINGGI_MAX_SENSOR = 200.0; // cm

    async function fetchThingSpeakData() {
        let url = `https://api.thingspeak.com/channels/${CHANNEL_ID}/feeds.json?results=8&api_key=${READ_API_KEY}`;

        try {
            const response = await fetch(url);
            const data = await response.json();
            const feeds = data.feeds;

            if (feeds && feeds.length > 0) {
                const latest = feeds[feeds.length - 1];
                
                const tinggiAir = parseFloat(latest.field1 || 0).toFixed(1);
                const jarakSensor = parseFloat(latest.field2 || 0).toFixed(1);
                const statusCode = parseInt(latest.field3 || 1);

                // Update Metric Box
                document.getElementById('val-tinggi').innerHTML = `${tinggiAir} <span class="unit">cm</span>`;
                document.getElementById('val-jarak').innerHTML = `${jarakSensor} <span class="unit">cm</span>`;

                // Update Status Badge
                const statusElem = document.getElementById('val-status');
                if (statusCode === 3) {
                    statusElem.innerText = 'BAHAYA';
                    statusElem.className = 'status-box st-bahaya';
                } else if (statusCode === 2) {
                    statusElem.innerText = 'WASPADA';
                    statusElem.className = 'status-box st-waspada';
                } else {
                    statusElem.innerText = 'NORMAL';
                    statusElem.className = 'status-box st-normal';
                }

                // Update Visual Air
                let percent = (tinggiAir / TINGGI_MAX_SENSOR) * 100;
                if (percent > 100) percent = 100;
                if (percent < 0) percent = 0;
                document.getElementById('water-fill').style.height = `${percent}%`;

                // Render Table Log
                const logBody = document.getElementById('log-body');
                logBody.innerHTML = '';

                feeds.slice().reverse().forEach(feed => {
                    const time = new Date(feed.created_at).toLocaleTimeString('id-ID');
                    const tAir = parseFloat(feed.field1 || 0).toFixed(1);
                    const jSensor = parseFloat(feed.field2 || 0).toFixed(1);
                    const sCode = parseInt(feed.field3 || 1);

                    let stText = 'NORMAL';
                    if (sCode === 3) stText = 'BAHAYA';
                    else if (sCode === 2) stText = 'WASPADA';

                    const row = `<tr>
                        <td>${time}</td>
                        <td>${tAir}</td>
                        <td>${jSensor}</td>
                        <td><b>${stText}</b></td>
                    </tr>`;
                    logBody.insertAdjacentHTML('beforeend', row);
                });

                document.getElementById('sync-status').innerText = 'Terhubung (' + new Date().toLocaleTimeString('id-ID') + ')';
                document.getElementById('sync-status').style.color = '#34d399';
            }
        } catch (err) {
            console.error('Fetch Error:', err);
            document.getElementById('sync-status').innerText = 'Gagal Mengambil Data';
            document.getElementById('sync-status').style.color = '#f87171';
        }
    }

    fetchThingSpeakData();
    setInterval(fetchThingSpeakData, 15000);
</script>

</body>
</html>
